[project]
name = "imagetrace"
version = "0.3.0"
description = "Local-first digital image evidence examination (Windows desktop)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.12.0",
    "Pillow==13.0.0",
    "reportlab==5.1.0",
    "cryptography==50.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-qt==4.5.0",
    "ruff==0.17.6",
    "pip-audit==2.10.1",
    "pyinstaller==6.22.3",
]

# Not installed as a package yet (would need setuptools from the network);
# app/src is put on sys.path by pytest config and tools/run_app.cmd.

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["app/src"]
qt_api = "pyside6"
cache_dir = ".cache/pytest"
# Keep pytest temp dirs on the project drive (pytest clears this folder each run).
addopts = "--basetemp=data/temp/pytest -ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app/src", "app/tests", "tools"]
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"app/tests/**" = ["S101"]
